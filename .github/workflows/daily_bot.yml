name: Ejecucion Diaria Bot Quant

on:
  schedule:
    - cron: '0 11 * * *'  # Todos los días a las 6:00 AM hora Colombia
  workflow_dispatch:      # Permite ejecutarlo manualmente cuando quieras

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependencias
        run: |
          pip install requests rapidfuzz flask

      - name: Ejecutar Bot
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python ejecutar_bot.py
