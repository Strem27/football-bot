name: Ejecucion Diaria Bot Quant

on:
  schedule:
    - cron: "17 0 * * *"   # 7:17 p. m. en Colombia (minuto 17 para evitar la congestión de las horas en punto)
  workflow_dispatch:
    inputs:
      accion:
        description: "Que hacer"
        type: choice
        default: escanear
        options:
          - escanear
          - resumen

permissions:
  contents: write

concurrency:
  group: football-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependencias
        run: pip install requests

      - name: Ejecutar Bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python ejecutar_bot.py ${{ github.event.inputs.accion == 'resumen' && 'resumen' || '' }}

      - name: Guardar historial
        run: |
          for f in historial_picks.csv partidos_analizados.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial"
          else
            git config user.name "football-bot"
            git config user.email "football-bot@users.noreply.github.com"
            git commit -m "Actualiza historial y partidos analizados"
            git push
          fi

