name: Ejecucion Diaria Bot Quant

on:
  schedule:
    - cron: "0 1 * * *"   # 8:00 p. m. en Colombia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: football-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Dependencias
        run: pip install requests

      - name: Ejecutar Bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python ejecutar_bot.py

      - name: Guardar historial
        run: |
          for f in historial_picks.csv partidos_analizados.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial"
          else
            git config user.name "football-bot"
            git config user.email "football-bot@users.noreply.github.com"
            git commit -m "Actualiza historial y partidos analizados"
            git push 
          fi
